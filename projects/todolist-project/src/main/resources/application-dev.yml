# =====================================================
# TodoList Application - Development Profile
# =====================================================

server:
  port: 8081

spring:
  # Database Configuration (H2 for development)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:../database-migrations/h2/data/todolist;MODE=MySQL
    username: sa
    password:

    druid:
      # Connection Pool Configuration
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000

      # Validation Configuration
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

      # Time Configuration
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

      # H2 Console (disabled by default, use standalone console instead)
      # Web Console: cd database-migrations/h2 && ./console.sh

  # Flyway Configuration (enabled for dev)
  flyway:
    enabled: true  # 开发环境启用自动迁移
    baseline-on-migrate: true
    locations: filesystem:../database-migrations/migrations
    encoding: UTF-8
    validate-on-migrate: true

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.todolist.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Logging Configuration
logging:
  level:
    root: INFO
    com.todolist: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
