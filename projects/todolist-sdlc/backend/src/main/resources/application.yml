server:
  port: 8080

spring:
  application:
    name: todolist-sdlc

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/todolist?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

  flyway:
    enabled: true
    locations: filesystem:database-migrations/migrations
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: todolist-sdlc-secret-key-for-jwt-token-generation-must-be-long-enough
  expiration: 86400000

logging:
  level:
    com.todolist: debug
    org.springframework.security: info
