server:
  port: 8080

spring:
  application:
    name: todolist-sdlc

  # 使用 docker-compose 中的 MySQL (localhost:3306)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/todolist?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: root123456

  flyway:
    enabled: false  # 默认禁用，仅在 dev 模式启用
    locations: classpath:db/migration,filesystem:database-migrations/migrations
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: todolist-sdlc-secret-key-for-jwt-token-generation-must-be-long-enough
  expiration: 86400000

logging:
  level:
    com.todolist: debug
    org.springframework.security: info
